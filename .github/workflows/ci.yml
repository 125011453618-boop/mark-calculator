on:
push:
branches: ["main"]
pull_request:
branches: ["main"]
jobs:
built-and-test:
runs-on: ubuntu-latest
steps:
-name: Checkout source code
uses: actions/checkout@v4
-name: Check project files
run: |
echo "Running CI process..."
is -la
-name: Validate HTML
run: |
test -f index.html
echo "HTML file exists"
-name: CI Success
run: echo "Build and validation completed sucessfully!"
